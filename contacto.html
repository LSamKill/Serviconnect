<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo">ServiConnect</a>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="contacto.html">Contacto</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="favoritos.html" class="carrito-link">❤️ <span id="carrito-contador" style="display:none;">0</span></a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="contacto">
    <div class="contacto-container">
      <h1>Contáctanos</h1>
      <p class="contacto-subtitle">¿Tienes alguna pregunta? Nos encantaría escucharte. Envíanos un mensaje.</p>

      <form id="formulario" class="contacto-form">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" placeholder="¿Cómo podemos ayudarte?" required>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" placeholder="Escribe tu mensaje aquí..." rows="6" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar mensaje</button>
      </form>

      <p id="respuesta" class="respuesta"></p>
    </div>
  </section>
</main>

</footer>

</body>
</html>
